# AI Message Translator — standalone Next.js full-stack app.
#
# The app is self-contained: its Next.js API routes talk directly to
#   - Anthropic (AI analysis)
#   - Google Cloud Vision (OCR)
#   - Neon serverless Postgres (storage, over HTTP — no local DB needed)
#
# Secrets are read from app/.env.local (ANTHROPIC_API_KEY, DATABASE_URL,
# GOOGLE_CREDENTIALS_JSON). Copy app/.env.example to app/.env.local and fill it in.

services:
  app:
    build:
      context: ./app
    ports:
      - "3000:3000"
    env_file:
      - ./app/.env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
